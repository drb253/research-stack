name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: lint · ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Shell syntax (bash -n)
        run: git ls-files '*.sh' | xargs -I{} bash -n {}
      - name: Python syntax (py_compile)
        run: |
          python3 - <<'PY'
          import subprocess, py_compile, sys
          files = subprocess.check_output(["git", "ls-files", "*.py"], text=True).split()
          # mcp/paper-search-patches/replacements holds whole-file copies AND code
          # fragments spliced in by apply_patches.py; the applied result is the
          # vendored package under mcp/paper-search-mcp/, which IS compiled here.
          skip = "mcp/paper-search-patches/replacements/"
          files = [f for f in files if not f.startswith(skip)]
          bad = []
          for f in files:
              try:
                  py_compile.compile(f, doraise=True)
              except py_compile.PyCompileError:
                  print("SYNTAX ERROR:", f)
                  bad.append(f)
          print(f"checked {len(files)} python files, {len(bad)} bad")
          sys.exit(1 if bad else 0)
          PY
      - name: Offline logic self-tests
        run: |
          python3 skills/humanizerdrb/scripts/humanizer_check.py --self-test
          python3 skills/evidence-synthesis-forge/scripts/cross_verify_citations.py --self-test
          # citecheck: pins the routing that keeps an unreachable registry out of the
          # findings, and the [UNRESOLVED] placeholder in the emitted reference list.
          python3 skills/citecheck/scripts/citecheck.py --self-test
          # originality toolkit: pins the corpus-gap routing (an unreadable corpus file must
          # reach the report and the exit code, not only stderr).
          python3 tools/originality-toolkit/originality_check.py --self-test
          # meta-ml-screener: this script was run nowhere at all, and a log with no data rows
          # reported through the finding channel until it gained this suite.
          python3 skills/meta-ml-screener/scripts/validate_screening_log.py --self-test
          # paper-search patch system: pins this checker's own drift and mutation detection.
          # The full check needs `requests` and runs in the mcp-tests job below.
          python3 mcp/paper-search-patches/ci_patch_check.py --self-test
      - name: medical-narrative-review selftest (30 checks)
        run: bash skills/medical-narrative-review/scripts/selftest.sh
      # citation-report writes its own PDF and DOCX and verifies both by re-opening them.
      # CI has neither poppler nor pypdf, so an unreadable PDF takes the "no extractor"
      # route here and the "no text layer" route on a developer machine; the suite asserts
      # both, and the absent-extractor route is forced with CITATION_REPORT_PDF_EXTRACTOR
      # so each machine covers both. Both routes must exit 4 as input gaps, never 1.
      - name: citation-report selftest (137-154 checks, depending on the PDF tools installed)
        run: bash skills/citation-report/scripts/selftest.sh
      # The offline benchmarks measure the claims in the README (arithmetic gate,
      # overlap detector vs the ORI guide's expert labels). They need no network,
      # so they run on every push; the live retraction benchmark does not.
      - name: Offline benchmarks (measured claims)
        run: |
          python3 benchmarks/bench_numeric.py
          python3 benchmarks/bench_ori_guide.py
          python3 benchmarks/bench_verdicts.py
      - name: Skill harnesses added by the accuracy pass
        run: |
          bash skills/environment-life-review-forge/scripts/selftest.sh
          bash skills/sysreview/scripts/selftest.sh
          bash skills/meta-analysis/scripts/selftest.sh
          bash skills/umbrella-review-skeptic/scripts/selftest.sh
      # The coverage gate asserts that every skill has a harness registered in
      # THIS file, that every declared gate has a pass and a fail fixture, and
      # that every eval.md item appears in its SKILL.md. The three e2e scorers
      # run their offline halves here; their live halves are informational.
      - name: Skill coverage + end-to-end rubrics (offline)
        run: |
          python3 tools/check_skill_coverage.py
          python3 tools/e2e_citecheck.py --offline
          python3 tools/e2e_humanizer.py --offline
          python3 tools/e2e_citation_report.py --offline
      # The toolkit asks tools/attribution.py for the defined claim, and that file
      # is a SIBLING of the toolkit directory. Copying the directory alone shipped a
      # toolkit that could not evaluate the claim, and no test saw it because the
      # deployed fallback was asserted instead. This step builds the DEPLOYED shape
      # (install.sh's copy) and requires the claim to be issued.
      - name: The deployed toolkit shape can evaluate the defined claim
        run: |
          T="$(mktemp -d)"
          cp -R tools/originality-toolkit "$T/originality-toolkit"
          cp tools/attribution.py "$T/originality-toolkit/attribution.py"
          mkdir -p "$T/corpus"
          printf 'Systematic reviews synthesize evidence across studies and report the certainty of the pooled estimate in a structured and auditable way.\n' > "$T/corpus/source.txt"
          printf 'This draft contains only original wording and makes no claim that requires a citation at all.\n' > "$T/draft.md"
          python3 "$T/originality-toolkit/originality_check.py" "$T/draft.md" --sources "" \
            --corpus "$T/corpus" \
            --attribution-evidence tools/originality-toolkit/fixtures/attribution_evidence_valid.json \
            --json "$T/out.json" --out "$T/out.md" >/dev/null
          python3 - "$T" <<'PY'
          import json, pathlib, sys
          root = pathlib.Path(sys.argv[1])
          a = json.loads((root / "out.json").read_text())["attribution"]
          assert a["issuable"], "the deployed toolkit withheld the claim: %s" % a["blockers"]
          assert "Scope:" in a["statement"], "the issued statement has no scope"
          report = (root / "out.md").read_text()
          assert "plagiarism-free when it meets one of these conditions" in report, "no definition"
          print("deployed toolkit issues the defined claim")
          PY
      - name: Installer dry-run (defaults + AIPOCH flag)
        run: bash install.sh --targets cline --dry-run --minimal --no-mcp --with-aipoch-skills >/dev/null
      # The STE, preservation and honesty gates. These were report-only while the
      # rewrite ran (the baseline was 536 errors); the rewrite reached 0 errors on
      # 2026-10-14, so they now fail a push. The remaining warnings are all R10
      # list-candidates: they report and do not fail.
      - name: STE + semantic-preservation + honesty gates
        run: |
          python3 tools/ste_lint.py --self-test
          python3 tools/normative_tokens.py --self-test
          python3 tools/normative_tokens.py --check tools/normative-baseline.json
          python3 tools/claim_guard.py --self-test
          python3 tools/check_descriptions.py --self-test
          python3 tools/attribution.py --self-test
          python3 tools/ste_lint.py --quiet --summary skills/*/SKILL.md
          python3 tools/claim_guard.py skills/*/SKILL.md
          python3 tools/check_descriptions.py skills

  r-tests:
    name: r-tests (engine + gates)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install R engine packages (binary)
        run: |
          Rscript -e 'install.packages(c("metafor","robvis","ggplot2","clubSandwich"), repos="https://packagemanager.posit.co/cran/__linux__/jammy/latest")'
      - name: Golden tests — engine vs metafor (22 checks)
        run: Rscript skills/meta-analysis-forge/scripts/golden_tests.R
      - name: evidence-synthesis-forge selftest (78 checks)
        run: bash skills/evidence-synthesis-forge/scripts/selftest.sh

  mcp-tests:
    name: mcp-tests (vendored servers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # Both suites shipped in the repo but no CI job ever ran them (103 tests).
      # `mcp` must stay <2 — the server imports mcp.server.fastmcp, which mcp 2.x
      # renamed to MCPServer (see mcp/ncbi-mcp-server/requirements.txt).
      - name: ncbi-mcp-server tests (57 unit; integration deselected by marker)
        run: |
          python3 -m pip install --quiet -r mcp/ncbi-mcp-server/requirements.txt
          python3 -m pip install --quiet pytest pytest-asyncio pytest-cov
          cd mcp/ncbi-mcp-server && PYTHONPATH=src python3 -m pytest tests/
      - name: academic-search tests (61, fully offline)
        run: |
          python3 -m pip install --quiet fastmcp numpy pandas requests
          cd mcp/academic-search-mcp && python3 -m unittest discover -s tests
      # The paper-search patch system edits a package that lives outside this repository,
      # so nothing on a push would have caught a patch that stopped applying or a
      # replacement that drifted from the vendored file it mirrors. ci_patch_check.py
      # supplies the missing target: a throwaway copy of the vendored package, patched for
      # real, checked for the fixes, and then mutated to prove the availability suite still
      # rejects the defect.
      #
      # The gate gets its own venv rather than borrowing the job's interpreter: two of the
      # suite's ten tests import the package's own server module, and the earlier steps in
      # this job install their own dependencies (the first run failed with `mcp` 2.x, which
      # renamed `mcp.server.fastmcp`). A hermetic environment with the package's own pins
      # cannot be perturbed by them, and the checker probes the imports and exits 4 --
      # never a pass -- if any is missing.
      - name: paper-search patch system + availability invariant (offline, gated)
        run: |
          python3 -m venv /tmp/ps-venv
          /tmp/ps-venv/bin/python -m pip install --quiet --upgrade pip
          /tmp/ps-venv/bin/python -m pip install --quiet requests httpx beautifulsoup4 feedparser pypdf 'mcp[cli]>=1.27.2,<2'
          /tmp/ps-venv/bin/python mcp/paper-search-patches/ci_patch_check.py
      # verify_fixes.py also performs LIVE searches; it is informational here so a network
      # hiccup cannot fail a push, but its offline check 10 runs above as a gate.
      - name: paper-search live checks (informational)
        continue-on-error: true
        run: PYTHONPATH=mcp/paper-search-mcp python3 mcp/paper-search-patches/verify_fixes.py
